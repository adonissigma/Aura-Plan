<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraPlan - Stable</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.3s; }
        .dark body { background-color: #121212; color: #ffffff; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .dark .glass {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 flex items-center justify-between p-4 border-b">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center text-white">
                <i class="fa-solid fa-infinity"></i>
            </div>
            <h1 class="text-xl font-bold">AuraPlan</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="p-4 max-w-5xl mx-auto">
        
        <!-- Greeting -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold mb-1">Chào bạn! ☀️</h2>
            <p class="text-gray-500 text-sm">Hôm nay bạn muốn làm gì?</p>
        </div>

        <!-- Grid Lịch Tuần -->
        <div class="glass rounded-2xl p-4 mb-6">
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="font-bold text-lg"><i class="fa-regular fa-calendar-days text-blue-500 mr-2"></i> Lịch Trình Tuần</h3>
                <div class="flex gap-2">
                    <button onclick="changeWeek(-1)" class="w-8 h-8 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <button onclick="changeWeek(1)" class="w-8 h-8 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
            </div>

            <!-- Container chứa 7 ngày -->
            <div id="week-container" class="flex gap-3 overflow-x-auto pb-2">
                <!-- JS sẽ vẽ 7 ngày ở đây -->
            </div>
        </div>

        <!-- Khu vực Thêm Task -->
        <div class="glass rounded-2xl p-4">
            <h3 class="font-bold text-lg mb-4"><i class="fa-solid fa-list-check text-emerald-500 mr-2"></i> Quản lý Nhiệm Vụ</h3>
            
            <div class="flex flex-col gap-4">
                <!-- Form thêm task -->
                <div class="flex gap-2">
                    <input type="text" id="task-input" placeholder="Nhập tên nhiệm vụ mới..." class="flex-1 p-2 border rounded-lg bg-transparent">
                    <input type="date" id="task-date" class="p-2 border rounded-lg bg-transparent">
                    <button onclick="addTask()" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-600 transition">Thêm</button>
                </div>

                <!-- Danh sách task -->
                <div id="task-list" class="flex flex-col gap-2">
                    <!-- JS sẽ vẽ danh sách task ở đây -->
                </div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. KHỞI TẠO DỮ LIỆU
        // ==========================================
        let appData = {
            theme: 'light',
            tasks: {} // Cấu trúc: {'2023-10-25': [{id: 1, title: 'Học bài', done: false}]}
        };

        // Tải dữ liệu từ LocalStorage
        function loadData() {
            const saved = localStorage.getItem('auraplan_stable_data');
            if (saved) {
                appData = JSON.parse(saved);
            }
            // Áp dụng theme
            if (appData.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            }
            // Set ngày mặc định cho input là hôm nay
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('task-date').value = todayStr;
        }

        // Lưu dữ liệu
        function saveData() {
            localStorage.setItem('auraplan_stable_data', JSON.stringify(appData));
            render();
        }

        // ==========================================
        // 2. CÁC HÀM XỬ LÝ GIAO DIỆN
        // ==========================================
        let currentWeekOffset = 0;

        function changeWeek(offset) {
            currentWeekOffset += offset;
            renderWeek();
        }

        function getStartOfWeek() {
            const today = new Date();
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1); // Thứ 2 là đầu tuần
            const start = new Date(today.setDate(diff));
            start.setDate(start.getDate() + (currentWeekOffset * 7));
            return start;
        }

        function renderWeek() {
            const container = document.getElementById('week-container');
            container.innerHTML = '';
            
            const startOfWeek = getStartOfWeek();
            const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
            const todayStr = new Date().toISOString().split('T')[0];

            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const isToday = dateStr === todayStr;

                // Đếm số task đã xong
                const dayTasks = appData.tasks[dateStr] || [];
                const doneCount = dayTasks.filter(t => t.done).length;
                const totalCount = dayTasks.length;

                const html = `
                    <div class="min-w-[100px] flex-1 border ${isToday ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20' : 'border-gray-200 dark:border-gray-700'} rounded-xl p-3 flex flex-col items-center cursor-pointer transition hover:shadow-md" onclick="selectDate('${dateStr}')">
                        <p class="text-xs font-bold ${isToday ? 'text-blue-500' : 'text-gray-500'}">${days[i]}</p>
                        <p class="text-lg font-bold">${d.getDate()}/${d.getMonth()+1}</p>
                        <div class="mt-2 text-xs text-gray-500">
                            ${totalCount === 0 ? 'Trống' : `${doneCount}/${totalCount} xong`}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            }
        }

        function selectDate(dateStr) {
            document.getElementById('task-date').value = dateStr;
            renderTasks();
        }

        function renderTasks() {
            const selectedDate = document.getElementById('task-date').value;
            const container = document.getElementById('task-list');
            const tasks = appData.tasks[selectedDate] || [];

            if (tasks.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Không có nhiệm vụ nào trong ngày này.</p>`;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="flex items-center justify-between p-3 border rounded-lg ${task.done ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'}">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${selectedDate}', ${task.id})" class="w-5 h-5 cursor-pointer accent-blue-500">
                        <span class="${task.done ? 'line-through text-gray-400' : 'font-medium'}">${task.title}</span>
                    </div>
                    <button onclick="deleteTask('${selectedDate}', ${task.id})" class="text-red-500 hover:text-red-700">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        // ==========================================
        // 3. CÁC HÀM XỬ LÝ DỮ LIỆU
        // ==========================================
        function addTask() {
            const title = document.getElementById('task-input').value.trim();
            const date = document.getElementById('task-date').value;

            if (!title || !date) {
                alert('Vui lòng nhập tên task và chọn ngày!');
                return;
            }

            if (!appData.tasks[date]) {
                appData.tasks[date] = [];
            }

            appData.tasks[date].push({
                id: Date.now(),
                title: title,
                done: false
            });

            document.getElementById('task-input').value = ''; // Xóa ô nhập
            saveData();
            renderTasks();
            renderWeek(); // Cập nhật lại số lượng trên lịch
        }

        function toggleTask(date, id) {
            const tasks = appData.tasks[date];
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveData();
                renderTasks();
                renderWeek();
            }
        }

        function deleteTask(date, id) {
            if (confirm('Bạn có chắc muốn xóa nhiệm vụ này?')) {
                appData.tasks[date] = appData.tasks[date].filter(t => t.id !== id);
                saveData();
                renderTasks();
                renderWeek();
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            appData.theme = isDark ? 'dark' : 'light';
            
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
            localStorage.setItem('auraplan_stable_data', JSON.stringify(appData));
        }

        // ==========================================
        // 4. CHẠY KHI TẢI TRANG
        // ==========================================
        function render() {
            renderWeek();
            renderTasks();
        }

        window.onload = function() {
            loadData();
            render();
            
            // Lắng nghe sự kiện đổi ngày để load lại danh sách task
            document.getElementById('task-date').addEventListener('change', renderTasks);
        };
    </script>
</body>
</html>
